name: Teardown Previews

# Deletes a pull request's preview catalogs when the PR closes, merged or not.
#
# publish-catalogs.yaml puts each PR's build at <catalog id>/PRs/<number>/.
# Without this they accumulate forever, and a public bucket slowly fills with
# builds of branches nobody remembers.
#
# It deletes only the closing PR's own prefixes. main/ and branches/ are
# unreachable from here. The guards are layered, the script refuses a
# non-numeric PR number and refuses again if the target it assembles does not
# still look like a PR prefix. See examples/tools/publish_catalogs.py.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork PR never published a preview, since publish is skipped there, and
    # it gets no credentials to delete one with either.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # The same environment publish-catalogs.yaml declares, so the two jobs read
    # the credentials from the same place. Whatever holds the secrets for the
    # publish has to hold them for the delete, or the previews outlive the
    # thing that made them. No url, this job publishes nothing.
    environment:
      name: source-coop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same commit pin as publish-catalogs.yaml, this repo publishes no tags.
      - name: Install s5cmd
        uses: peak/action-setup-s5cmd@bde462e7399c68b4a9b05549d90b0e7d5c95e60f
        with:
          version: v2.3.0

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Delete the preview prefixes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SOURCE_COOP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_COOP_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # A run that gets this far is a non-fork pull request, which always
          # has credentials. Missing ones mean they were moved or revoked, and
          # the deletion this workflow exists to make cannot happen. Skipping
          # quietly would report success while leaving the preview in a public
          # bucket forever, and the orphan would be invisible because every
          # check stayed green. Better to be red now than to find out later
          # from the bucket.
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::No Source Cooperative credentials in this job, so the" \
              "preview catalogs for PR ${PR_NUMBER} were not deleted and will" \
              "stay in the public bucket. Check that SOURCE_COOP_ACCESS_KEY_ID" \
              "and SOURCE_COOP_SECRET_ACCESS_KEY are readable from the" \
              "source-coop environment."
            exit 1
          fi
          uv run examples/tools/publish_catalogs.py --teardown-pr "$PR_NUMBER"
