name: Teardown Previews

# Deletes a pull request's preview catalogs when the PR closes, merged or not.
#
# publish-catalogs.yaml puts each PR's build at <catalog id>/PRs/<number>/.
# Without this they accumulate forever, and a public bucket slowly fills with
# builds of branches nobody remembers.
#
# It deletes only the closing PR's own prefixes. main/ and branches/ are
# unreachable from here. The guards are layered, the script refuses a
# non-numeric PR number and refuses again if the target it assembles does not
# still look like a PR prefix. See examples/tools/publish_catalogs.py.
#
# It signs in the way publish-catalogs.yaml does, with GitHub OIDC as the
# Source Cooperative service account portolan-mirrors--spec-examples, and
# deletes through the data proxy at https://data.source.coop. The
# SOURCE_COOP_ACCESS_KEY_ID and SOURCE_COOP_SECRET_ACCESS_KEY secrets are no
# longer read.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork PR never published a preview, since publish is skipped there, and
    # it gets no OIDC token to delete one with either.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # the sign-in step asks GitHub for an OIDC token
    # The same environment publish-catalogs.yaml declares, and it is load
    # bearing. The service account trusts only tokens whose subject is
    # repo:portolan-sdi/portolan-spec:environment:source-coop, so the delete
    # signs in only from this environment. If the publish and the delete ran
    # from different environments, one of them would be refused and the
    # previews would outlive the thing that made them. No url, this job
    # publishes nothing.
    environment:
      name: source-coop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # publish_catalogs.py pins the AWS CLI in its own header, so the delete
      # and the publish run the same client version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Trades the job's OIDC token at the data proxy for credentials as the
      # service account, and exports them to the steps after it. A refused
      # sign-in fails this step, so a PR whose preview cannot be deleted turns
      # red. Skipping quietly would leave the preview in a public bucket
      # forever, and the orphan would be invisible because every check stayed
      # green.
      - name: Sign in to Source Cooperative as portolan-mirrors--spec-examples
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::portolan-mirrors--spec-examples:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2

      - name: Delete the preview prefixes
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: uv run examples/tools/publish_catalogs.py --teardown-pr "$PR_NUMBER"
