name: Examples

# The generator under examples/tools/ ships thirteen checks and nothing ran them.
# They cover catalog conformance, the committed COG and GeoParquet, the MapLibre
# style URLs, the thumbnail geometry, the fetch cache, the runnable code blocks
# in the committed docs, the raster-mosaic path, the stac-geoparquet item
# mirror, and the expected-findings baseline. Several catch defects nothing else
# does, see examples/tools/CLAUDE.md.
#
# Every check is offline and deterministic, and the whole suite runs in about
# half a minute. So this runs on every pull request with no path filter, which
# keeps it eligible to be a required status check. A path-filtered workflow
# cannot be required, it stays pending on the PRs it skips.
#
# No path filter is also what makes check_baseline.py load bearing. It is the
# only check that sees a pull request touching the accepted-findings baseline
# alone, so it pins that file's values rather than its shape.
#
# The upstream sources are a different problem. Proving them means refetching
# five third-party servers, which is slow and fails for reasons unrelated to any
# PR, so that runs on a schedule in catalog-upstream.yaml instead.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are worth cancelling. Runs on main are not, a cancelled
  # one leaves a gap in the record of what was green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv stopped publishing floating major tags after v7, so this is
      # pinned to an exact version while checkout above can float. What raises
      # it is .github/dependabot.yml, since an exact pin is only safe while
      # something keeps it current.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # Each check_*.py carries its own PEP 723 dependencies, so the cache
          # key has to follow the scripts rather than a lockfile.
          cache-dependency-glob: 'examples/tools/**/*.py'

      - name: Run the generator checks
        run: uv run examples/tools/tests/run_all.py
