name: Requirements Manifest

# Keeps specs/portolan/requirements.yaml and the spec prose in lockstep.
# The manifest anchors a stable ID to every normative sentence; rashid keys
# its coverage gate to those IDs. See specs/tools/check_requirements.py.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Exact version, setup-uv has no floating v9 tag. See examples-checks.yaml.
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run specs/tools/check_requirements.py
