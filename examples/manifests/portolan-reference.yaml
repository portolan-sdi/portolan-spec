# Portolan reference catalog manifest, authored against Portolan spec v0.1.0.
#
# One manifest file describes one whole catalog. build.py reads every *.yaml in
# this directory and builds each into its own tree under the output directory,
# named after the file stem (this file builds catalog/portolan-reference/). Name
# the file after the `id` below, so the stem, the build directory, and the
# published prefix are all one name.
#
# Every source below is the TRUE original upstream, in its native format, pulled
# directly from the producer (not a CDN convenience mirror or a derived sample).
# build.py downloads each source once, converts it to a cloud-native canonical
# asset (GeoParquet for vector and tabular, COG for raster), and also cites the
# original file as a source-role asset with its own real file:size and multihash
# file:checksum.
#
# Build it:
#   uv run examples/tools/build.py
#
# Everything catalog-specific lives here, not in the generator. That includes the
# nested-catalog titles under `catalogs` below, keyed by the first id segment of
# each collection. Provenance is DERIVED from providers. If the sole producer org
# differs from the host, the collection is a mirror and MUST carry provenance.via
# and provenance.updated (build.py errors otherwise). Where the producer also
# hosts (a "host" role on a producer entry), the collection is official and the
# Portolan host is not appended.
#
# Every collection here is a MIRROR, and that is not an oversight. The spec
# derives the kind from who hosts THIS copy, and says an organization hosting
# data it did not produce is a mirror even when it is the primary distributor.
# Portolan SDI serves every asset in this tree and produced none of the data, so
# naming an upstream producer as host would be false. A catalog can only be
# official for data its own publisher originates.
#
# A collection whose license is the STAC value `other` MUST also set
# `license_url`, the URL of the license text. build.py emits the required
# rel=license link from it and errors if it is missing.
#
# Output CRS. By default every vector and raster collection keeps its source
# CRS in the canonical asset. Set output_crs at the top level to change it for
# the whole catalog, or per collection to override one. The STAC bbox stays
# WGS84 and thumbnails stay Web Mercator regardless.
#   output_crs: EPSG:4326

id: portolan-reference
title: Portolan Reference Catalog
description: >-
  A mixed reference catalog exercising every major case in the Portolan v0.1
  specification with real, openly licensed data pulled from its original
  upstream sources, vector polygons and points, raster, tabular, mirror
  provenance, nested catalogs and flat collections.
schema_uri: https://schemas.portolan-sdi.org/portolan/v0.1.0/schema.json

host:
  name: Portolan SDI
  url: https://github.com/portolan-sdi
  email: portolan@googlegroups.com

# Thumbnail rendering. build.py draws each thumbnail in Web Mercator at the
# data's true aspect ratio over this XYZ tile basemap, so previews read as real
# maps rather than stretched squares. tiles.py fetches only the tiles the framed
# extent needs at the matching zoom, and caches them under .cache. The default is
# the CARTO light (Positron) basemap. Swap the url for any XYZ tile template,
# using Python str.format placeholders {z}/{x}/{y}.
# ocean_color is the fallback fill used only when no basemap is set.
thumbnails:
  size: 768
  ocean_color: "#eef3f8"
  basemap:
    url: https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png
    attribution: "© OpenStreetMap contributors © CARTO"

# Titles and descriptions for the nested catalogs, keyed by the first segment of
# each collection id. build.py groups collections by this segment and reads the
# matching entry here for the intermediate catalog metadata.
catalogs:
  reference:
    title: Reference Basemaps
    description: >-
      Public domain reference basemap layers for general orientation and joins.
  boundaries:
    title: Administrative Boundaries
    description: >-
      Administrative and open-space boundary Collections from official sources.
  mirror:
    title: Mirrored Collections
    description: >-
      Cloud-native mirror Collections of data maintained elsewhere.
  raster:
    title: Raster Data
    description: >-
      Cloud Optimized GeoTIFF raster Collections.
  tabular:
    title: Tabular Data
    description: >-
      Non-geospatial companion tables published as Parquet.

collections:
  # ---------------------------------------------------------------- reference/
  - id: reference/natural-earth-countries
    kind: vector
    geometry: polygon
    title: Natural Earth Countries (1:110m)
    description: >-
      World country boundaries at 1:110m scale from Natural Earth, the public
      domain reference basemap maintained by NACIS. Republished as cloud-native
      GeoParquet alongside the original zipped Shapefile.
    keywords: [boundaries, countries, natural-earth, reference, basemap]
    license: CC0-1.0
    source:
      url: https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip
      media_type: application/zip
      title: Natural Earth 110m Admin 0 Countries (zipped Shapefile)
      layer: ne_110m_admin_0_countries
      stable: true
    providers:
      - {name: Natural Earth, url: https://www.naturalearthdata.com, roles: [producer, licensor]}
    provenance:
      via: https://www.naturalearthdata.com/downloads/110m-cultural-vectors/
      updated: "2026-07-16T00:00:00Z"
    temporal: ["2025-01-01T00:00:00Z", null]
    # No PMTiles on purpose. At 281 KB this GeoParquet is small enough for a client
    # to draw directly, which is the render-from-source path core.md offers
    # alongside a visualization derivative. Keeping it derivative-free is what
    # exercises that branch, every other vector Collection here takes the PMTiles
    # branch. Self-rendering also means no style asset is owed.
    derivatives: {pmtiles: false, thumbnail: true}
    # No PMTiles, so these styles name the GeoParquet itself as their source.
    # A Portolan client that renders GeoParquet directly, portolan-browser
    # does from its PR #28, binds them onto the data it loaded. The first
    # variant is the default, and the thumbnail paints from it.
    style:
      color: "#4d7ea8"
      variants:
        - name: continents
          title: Countries by continent
          description: >-
            Each continent shares one colour from the catalog palette,
            including the Seven seas (open ocean) group Natural Earth assigns
            the French Southern and Antarctic Lands.
          type: categorical
          field: CONTINENT
        - name: map-colors
          title: Classic seven-colour map
          description: >-
            Natural Earth's MAPCOLOR7 index, precomputed so neighbouring
            countries never share a colour, the classic political-map look.
          type: categorical
          field: MAPCOLOR7
          sort: value
        - name: income-groups
          title: World Bank income groups
          description: >-
            The INCOME_GRP ordinal, deep green for high-income OECD economies
            through red for low-income, a five-step diverging palette in the
            field's own order.
          type: categorical
          field: INCOME_GRP
          sort: value
          palette: ["#1a9850", "#91cf60", "#fee08b", "#fc8d59", "#d73027"]
        - name: population
          title: Population in four classes
          description: >-
            POP_EST binned at ten million, fifty million, and two hundred
            million, light to dark blue, class breaks chosen so the map
            separates small states from the giants despite the skew.
          type: graduated
          field: POP_EST
          breaks: [10000000, 50000000, 200000000]
        - name: labeled
          title: Continents with country names
          description: >-
            The continent colouring with a NAME label per country.
          type: categorical
          field: CONTINENT
          labels: {field: NAME, size: 10}

  - id: reference/natural-earth-populated-places
    kind: vector
    geometry: point
    title: Natural Earth Populated Places (1:50m)
    description: >-
      Point locations of populated places, cities and towns, at 1:50m scale
      from Natural Earth. Public domain reference points, republished as
      cloud-native GeoParquet alongside the original zipped Shapefile.
    keywords: [places, cities, points, natural-earth, reference]
    license: CC0-1.0
    source:
      url: https://naciscdn.org/naturalearth/50m/cultural/ne_50m_populated_places.zip
      media_type: application/zip
      title: Natural Earth 50m Populated Places (zipped Shapefile)
      layer: ne_50m_populated_places
      stable: true
    providers:
      - {name: Natural Earth, url: https://www.naturalearthdata.com, roles: [producer, licensor]}
    provenance:
      via: https://www.naturalearthdata.com/downloads/50m-cultural-vectors/
      updated: "2026-07-16T00:00:00Z"
    temporal: ["2025-01-01T00:00:00Z", null]
    # No PMTiles on purpose, same render-from-source reasoning as the countries
    # Collection above. 604 KB of points a client can draw itself.
    derivatives: {pmtiles: false, thumbnail: true}
    # GeoParquet-sourced styles, same reasoning as the countries Collection.
    # The flat default keeps the existing thumbnail, the other variants show a
    # graduated symbol, a categorical, a highlight expression, and a heatmap.
    style:
      color: "#c65b3c"
      variants:
        - name: places
          title: Populated places
          description: All 1,251 places as uniform warm-red points.
          type: flat
        - name: population
          title: Metro population, size and colour
          description: >-
            POP_MAX binned at one hundred thousand, one million, and ten
            million drives both the colour ramp and the circle radius, Tokyo
            reads as the largest, darkest point.
          type: graduated
          field: POP_MAX
          breaks: [100000, 1000000, 10000000]
          ramp: ["#fee5d9", "#fcae91", "#fb6a4a", "#a50f15"]
          radius_range: [2, 12]
        - name: feature-class
          title: Places by feature class
          description: >-
            FEATURECLA separates national and regional capitals, plain
            populated places, and the 40 Antarctic scientific stations.
          type: categorical
          field: FEATURECLA
        - name: capitals
          title: National capitals highlighted
          description: >-
            The 200 rows flagged ADM0CAP render large and red over the rest in
            muted gray.
          type: expression
          paint:
            circle-color: ["case", ["==", ["get", "ADM0CAP"], 1], "#d32f2f", "#b0bec5"]
            circle-radius: ["case", ["==", ["get", "ADM0CAP"], 1], 5, 2.5]
        - name: density
          title: Place density heatmap
          description: >-
            A MapLibre heatmap layer over the points, showing where the curated
            selection concentrates.
          type: heatmap

  # --------------------------------------------------------------- boundaries/
  - id: boundaries/us-counties
    kind: vector
    geometry: polygon
    title: United States Counties (2023, 1:500k)
    description: >-
      County and equivalent boundaries for the United States, the 2023
      cartographic boundary file at 1:500,000 from the US Census Bureau,
      generalized for small-scale mapping. Republished as cloud-native
      GeoParquet alongside the original zipped Shapefile.
    keywords: [boundaries, counties, united-states, census, tiger]
    license: CC0-1.0
    source:
      url: https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip
      media_type: application/zip
      title: US Census cartographic boundary counties 2023 500k (zipped Shapefile)
      layer: cb_2023_us_county_500k
      stable: true
    providers:
      - {name: U.S. Census Bureau, url: https://www.census.gov, roles: [producer, licensor]}
    provenance:
      # No canonical link. The spec owes one only when the upstream publishes its
      # own STAC, and the Census Bureau does not. The data.gov record that used to
      # sit here was neither STAC nor even the same product, it described the 2024
      # TIGER/Line file rather than this 2023 cartographic boundary file.
      via: https://www.census.gov/geographies/mapping-files/time-series/geo/carto-boundary-file.html
      updated: "2026-07-16T00:00:00Z"
    temporal: ["2023-01-01T00:00:00Z", null]
    # The data spans the antimeridian (Aleutians to American Samoa), so frame the
    # preview on the contiguous US. This affects the thumbnail only, not the data.
    thumbnail_bbox: [-125.0, 24.0, -66.5, 49.5]
    derivatives: {pmtiles: true, thumbnail: true}
    # Colour counties by their state. The same block drives the thumbnail and the
    # categorical MapLibre style, so the preview mirrors the map.
    # The first variant is the default style, and the thumbnail is rendered from
    # it, so a collection coloured by category leads with the categorical variant.
    # A flat `default` variant here would force a single-colour preview.
    style:
      color: "#6b8e5a"
      variants:
        - name: states
          title: Counties by state
          description: >-
            Every county coloured by STATE_NAME from the catalog palette, the
            classic mosaic that makes state boundaries emerge from county
            fills.
          type: categorical
          field: STATE_NAME
        - name: labeled
          title: State colours with county names
          description: The state mosaic with a NAME label per county.
          type: categorical
          field: STATE_NAME
          labels: {field: NAME, size: 9}
        - name: land-area
          title: Land area in four classes
          description: >-
            ALAND binned at one, two and a half, and ten billion square
            metres, light to dark blue, Alaska's census areas anchor the dark
            end.
          type: graduated
          field: ALAND
          breaks: [1000000000, 2500000000, 10000000000]
        - name: water-share
          title: Share of water
          description: >-
            AWATER divided by total area, binned in the style expression
            itself, near-white for dry counties through deep blue where
            territorial water dominates.
          type: expression
          paint:
            fill-color: ["step",
                         ["/", ["get", "AWATER"],
                          ["max", ["+", ["get", "ALAND"], ["get", "AWATER"]], 1]],
                         "#f7fbff", 0.05, "#bdd7e7", 0.2, "#6baed6", 0.5, "#08306b"]
        - name: county-types
          title: Kinds of county equivalent
          description: >-
            The LSAD code, separating counties from Louisiana parishes, Alaska
            boroughs and census areas, Puerto Rico municipios, independent
            cities, and Connecticut's planning regions.
          type: categorical
          field: LSAD

  - id: boundaries/boston-open-space
    kind: vector
    geometry: polygon
    title: Boston Open Space
    description: >-
      City of Boston open spaces and parks, playgrounds, athletic fields,
      conservation land, and cemeteries, 1,012 polygons from the City of Boston
      GIS open data platform. Official primary source, republished as
      cloud-native GeoParquet with a PMTiles visualization and MapLibre styles.
    keywords: [open-space, parks, boston, recreation, boundaries]
    license: PDDL-1.0
    source:
      url: https://opendata.arcgis.com/api/v3/datasets/2868d370c55d4d458d4ae2224ef8cddd_7/downloads/data?format=shp&spatialRefId=4326
      media_type: application/zip
      title: City of Boston Open Space (zipped Shapefile export)
      stable: false
    providers:
      - {name: City of Boston, url: https://data.boston.gov, roles: [producer, licensor]}
    provenance:
      # The ArcGIS Hub item the source export is generated from. data.boston.gov
      # itself returns 403 to every automated client, so it is a poor link target.
      via: https://bostonopendata-boston.opendata.arcgis.com/datasets/2868d370c55d4d458d4ae2224ef8cddd_7
      updated: "2026-07-21T00:00:00Z"
    temporal: ["2025-01-01T00:00:00Z", null]
    derivatives: {pmtiles: true, thumbnail: true}
    style:
      color: "#2e7d32"
      variants:
        - name: types
          title: Open space by type
          description: >-
            TypeLong separates parks, parkways and reservations, cemeteries,
            urban wilds, malls and plazas, and community gardens.
          type: categorical
          field: TypeLong
        - name: labeled
          title: Types with site names
          description: The type colouring with a SITE_NAME label per site.
          type: categorical
          field: TypeLong
          labels: {field: SITE_NAME, size: 9}
        - name: acreage
          title: Acreage in four classes
          description: >-
            ACRES binned at one, ten, and one hundred acres, light to dark
            green, from pocket parks through Franklin Park's 392 acres.
          type: graduated
          field: ACRES
          breaks: [1, 10, 100]
          ramp: ["#e8f5e9", "#a5d6a7", "#66bb6a", "#1b5e20"]
        - name: ownership
          title: Who owns it
          description: >-
            OWNERSHIP from the catalog palette, city, Commonwealth, federal,
            and the 214 privately owned sites side by side.
          type: categorical
          field: OWNERSHIP
        - name: protection
          title: Permanently protected or not
          description: >-
            The POS flag, deep green where protection is permanent under
            Article 97 or a conservation restriction, gray where it is not.
            The inner match relabels the raw X and N codes so the legend a
            client derives from the outer match reads in plain words.
          type: expression
          paint:
            fill-color: ["match",
                         ["match", ["get", "POS"],
                          "X", "Protected forever", "N", "Not protected",
                          "Unclear"],
                         "Protected forever", "#1b5e20",
                         "Not protected", "#bdbdbd",
                         "#fdd835"]

  - id: boundaries/netherlands-provinces
    kind: vector
    geometry: polygon
    title: Netherlands Provinces
    description: >-
      The 12 provinces of the Netherlands, administrative boundaries from the
      Dutch national spatial data infrastructure PDOK, derived from the Kadaster
      BRK Bestuurlijke Gebieden. Republished as cloud-native GeoParquet with a
      PMTiles visualization and categorical, labeled MapLibre styles.
    keywords: [boundaries, provinces, netherlands, administrative, pdok]
    license: CC-BY-4.0
    attribution: Kadaster / PDOK
    source:
      url: https://service.pdok.nl/kadaster/brk-bestuurlijke-gebieden/atom/downloads/BestuurlijkeGebieden_2026.gpkg
      media_type: application/geopackage+sqlite3
      title: PDOK Bestuurlijke Gebieden 2026 (GeoPackage)
      layer: provinciegebied
      stable: true
    providers:
      - {name: Kadaster, url: https://www.kadaster.nl, roles: [producer, licensor]}
      - {name: PDOK, url: https://www.pdok.nl, roles: [processor]}
    provenance:
      # No canonical link, PDOK publishes OGC API Features for this dataset but no
      # STAC. The GeoNetwork ISO 19115 record that used to sit here is metadata,
      # not STAC, so it does not satisfy the conditional canonical requirement.
      via: https://www.pdok.nl/introductie/-/article/bestuurlijke-gebieden
      updated: "2026-07-16T00:00:00Z"
    temporal: ["2026-01-01T00:00:00Z", null]
    derivatives: {pmtiles: true, thumbnail: true}
    style:
      color: "#e65100"
      variants:
        - name: provinces
          title: Provinces by name
          description: Twelve provinces, one palette colour each.
          type: categorical
          field: naam
        - name: labeled
          title: Provinces with names
          description: The province colouring with a naam label on each.
          type: categorical
          field: naam
          labels: {field: naam, size: 12}
        - name: randstad
          title: The Randstad and the rest
          description: >-
            Noord-Holland, Zuid-Holland, and Utrecht, the provinces of the
            Randstad conurbation, highlighted orange against the rest in muted
            green.
          type: expression
          paint:
            fill-color: ["match", ["get", "naam"],
                         "Noord-Holland", "#e65100",
                         "Zuid-Holland", "#e65100",
                         "Utrecht", "#e65100",
                         "#a5b8a5"]
        - name: boundaries
          title: Boundary lines only
          description: >-
            Province borders as bare lines with no fill, for use over other
            layers.
          type: outline
          color: "#5d4037"
          width: 1.8

  # ------------------------------------------------------------------- mirror/
  - id: mirror/san-francisco-addresses
    kind: vector
    geometry: point
    title: San Francisco Addresses (EAS)
    description: >-
      Point addresses from the City and County of San Francisco Enterprise
      Addressing System, a 5,000-feature extract of the official DataSF open
      data layer, converted to cloud-native GeoParquet with a PMTiles
      visualization. The source asset points at the full live DataSF layer.
    keywords: [addresses, points, san-francisco, datasf, eas]
    license: PDDL-1.0
    source:
      url: https://data.sfgov.org/resource/ramy-di5m.geojson?$limit=5000&$order=:id
      media_type: application/geo+json
      title: DataSF San Francisco Addresses with Units (GeoJSON, 5k extract)
      stable: false
    providers:
      - {name: City and County of San Francisco, url: https://www.sf.gov, roles: [producer, licensor]}
      - {name: DataSF, url: https://datasf.org/opendata/, roles: [processor]}
    provenance:
      # No canonical link, Socrata exposes view metadata as JSON but no STAC.
      via: https://data.sfgov.org/
      updated: "2026-07-21T00:00:00Z"
    temporal: ["2018-10-12T00:00:00Z", null]
    derivatives: {pmtiles: true, thumbnail: true}
    style:
      color: "#6a1b9a"
      variants:
        - name: addresses
          title: Address points
          description: All 5,000 sampled address records as uniform points.
          type: flat
        - name: sources
          title: Where each record entered the EAS
          description: >-
            direct_source separates the DBI-approved records from the State of
            CA batch and the handful from the Presidio Trust.
          type: categorical
          field: direct_source
        - name: units
          title: Unit records against base addresses
          description: >-
            Orange where the record carries a unit_number, teal for base
            addresses, the coalesce guards against both null and absent
            attributes.
          type: expression
          paint:
            circle-color: ["case",
                           ["==", ["coalesce", ["get", "unit_number"], ""], ""],
                           "#00796b", "#e8710a"]
        - name: neighborhoods
          title: Analysis neighborhoods
          description: >-
            nhood from the cycling catalog palette, forty neighborhoods, so
            colours repeat, adjacency keeps them readable.
          type: categorical
          field: nhood
        - name: density
          title: Address density heatmap
          description: >-
            A MapLibre heatmap over the sample. Density reflects the sample's
            internal ordering, not San Francisco, see the README caveat.
          type: heatmap

  # ------------------------------------------------------------------- raster/
  - id: raster/sample-cog
    kind: raster
    title: Sample Raster COG
    description: >-
      A small 3-band Cloud Optimized GeoTIFF used to exercise the raster path
      end to end. Optimized to a COG with per-band statistics, minimum, maximum,
      mean, and standard deviation, embedded in the header. From the rasterio
      test fixtures, a 3-band raster in UTM zone 18N (EPSG:32618).
    keywords: [raster, cog, sample, rgb, geotiff]
    license: BSD-3-Clause
    source:
      url: https://raw.githubusercontent.com/rasterio/rasterio/main/tests/data/RGB.byte.tif
      media_type: image/tiff
      title: rasterio RGB.byte.tif test fixture (GeoTIFF)
      stable: true
    providers:
      - {name: rasterio, url: https://github.com/rasterio/rasterio, roles: [producer, licensor]}
    provenance:
      via: https://github.com/rasterio/rasterio/blob/main/tests/data/RGB.byte.tif
      updated: "2026-07-21T00:00:00Z"
    temporal: ["2020-01-01T00:00:00Z", null]
    derivatives: {thumbnail: true}

  # ------------------------------------------------------------------ tabular/
  - id: tabular/eurostat-electricity-prices
    kind: tabular
    title: Eurostat Electricity Prices for Household Consumers
    description: >-
      Semi-annual electricity prices for household consumers across European
      countries by consumption band, tax component, and currency, Eurostat table
      nrg_pc_204. Non-geospatial companion table, join key is the country code
      column geo (NUTS-0), converted to cloud-native Parquet.
    keywords: [energy, electricity, prices, eurostat, tabular]
    license: CC-BY-4.0
    attribution: "Source, Eurostat"
    source:
      url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nrg_pc_204/?format=SDMX-CSV&compressed=false
      media_type: text/csv
      title: Eurostat nrg_pc_204 electricity prices (SDMX-CSV)
      stable: false
    providers:
      - {name: Eurostat, url: https://ec.europa.eu/eurostat, roles: [producer, licensor]}
    provenance:
      via: https://ec.europa.eu/eurostat/databrowser/view/nrg_pc_204/default/table
      updated: "2026-07-21T00:00:00Z"
    temporal: ["2007-01-01T00:00:00Z", null]
    derivatives: {thumbnail: false}
    # A tabular Collection has no geometry, but the spec still asks its bbox to be
    # the area of interest the data pertains to. This table reports European
    # countries, so the world bbox would drag the whole catalog extent global.
    # Azores in the west to Georgia in the east, Crete in the south to Nordkapp.
    bbox: [-31.5, 34.0, 46.5, 71.5]
    # Geometry and attributes live in separate files, so the join is documented
    # explicitly and a runnable example is emitted into the README.
    join:
      column: geo
      target: reference/natural-earth-countries
      target_column: ISO_A2
      target_file: ../../reference/natural-earth-countries/natural-earth-countries.parquet
      note: >-
        Eurostat uses NUTS-0 country codes, which match ISO 3166-1 alpha-2 for
        most countries but not all. Greece is EL rather than GR and the United
        Kingdom is UK rather than GB, so remap those two before joining if you
        need them.
    # SDMX dimension codes are unreadable without prose, and for a table the column
    # schema is the only semantic handle a consumer gets.
    columns:
      DATAFLOW: Eurostat dataflow identifier, agency, table code, and version.
      LAST UPDATE: Timestamp of the last update Eurostat published for this table.
      freq: Observation frequency. S is semi-annual.
      siec: Standard International Energy Product Classification code for the energy carrier, here electricity.
      nrg_cons: Annual household electricity consumption band the price applies to.
      unit: Unit of measure for the observed value, for example kilowatt hour.
      tax: Tax and levy component, which taxes the quoted price includes or excludes.
      currency: Currency of the observed value, euro, national currency, or purchasing power standard.
      geo: Reporting country as a Eurostat NUTS-0 code. This is the join key to a geometry Collection.
      TIME_PERIOD: Reference period, year and semester.
      OBS_VALUE: The observed electricity price in the stated unit and currency.
      OBS_FLAG: Observation status flag, for example p provisional, e estimated, d definition differs.
      CONF_STATUS: Confidentiality status of the observation.
