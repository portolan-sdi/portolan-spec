  boundaries/us-counties:
    title: مقاطعات الولايات المتحدة لعام 2023 بمقياس 1:500 ألف
    description: >-
      حدود المقاطعات وما يعادلها من ملف التعداد الأمريكي لعام 2023.
      تنشر المجموعة الحدود المبسطة بصيغة GeoParquet مع المصدر الأصلي.
    keywords: [حدود, مقاطعات, الولايات المتحدة, تعداد, TIGER]
    assets:
      style-states:
        title: المقاطعات حسب الولاية
        description: "يلون النمط كل مقاطعة حسب STATE_NAME من لوحة ألوان الكتالوج. تنتج الفسيفساء الكلاسيكية حدود الولايات من تعبئة المقاطعات."
      style-labeled:
        title: ألوان الولايات مع أسماء المقاطعات
        description: "يعرض النمط فسيفساء الولايات مع تسمية NAME لكل مقاطعة."
      style-land-area:
        title: مساحة اليابسة في أربع فئات
        description: "يقسم النمط ALAND عند مليار ومليارين ونصف وعشرة مليارات متر مربع، من الأزرق الفاتح إلى الداكن. تقع مناطق التعداد في ألاسكا عند الطرف الداكن."
      style-water-share:
        title: نسبة المياه
        description: "يقسم النمط AWATER على المساحة الكلية، ثم يحدد الفئات داخل تعبير النمط. يمتد اللون من شبه الأبيض للمقاطعات الجافة إلى الأزرق الداكن حيث تسود المياه الإقليمية."
      style-county-types:
        title: أنواع ما يعادل المقاطعة
        description: "يفصل رمز LSAD المقاطعات عن أبرشيات لويزيانا وأحياء ألاسكا ومناطق التعداد وبلديات بورتوريكو والمدن المستقلة ومناطق التخطيط في كونيتيكت."
