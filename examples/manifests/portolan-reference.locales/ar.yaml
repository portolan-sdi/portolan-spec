collections:
  reference/natural-earth-countries:
    title: دول Natural Earth بمقياس 1:110 مليون
    description: >-
      حدود دول العالم من Natural Earth بمقياس 1:110 مليون.
      تنشر المجموعة GeoParquet مع ملف Shapefile الأصلي المضغوط.
    keywords: [حدود, دول, Natural Earth, مرجع, خريطة أساس]
    assets:
      style-continents:
        title: الدول حسب القارة
        description: "تستخدم كل قارة لونا واحدا من لوحة ألوان الكتالوج. يشمل ذلك مجموعة Seven seas (open ocean) التي يضع فيها Natural Earth الأراضي الفرنسية الجنوبية والقطبية الجنوبية."
      style-map-colors:
        title: خريطة سياسية كلاسيكية بسبعة ألوان
        description: "يستخدم النمط فهرس MAPCOLOR7 من Natural Earth. يحسب الفهرس مسبقا كي لا تشترك الدول المتجاورة في لون، كما في الخرائط السياسية الكلاسيكية."
      style-income-groups:
        title: فئات الدخل حسب البنك الدولي
        description: "يستخدم النمط ترتيب INCOME_GRP، من الأخضر الداكن لاقتصادات OECD مرتفعة الدخل إلى الأحمر للاقتصادات منخفضة الدخل. تتبع لوحة الألوان المتباعدة ذات الدرجات الخمس ترتيب الحقل."
      style-population:
        title: عدد السكان في أربع فئات
        description: "يقسم النمط POP_EST عند عشرة ملايين وخمسين مليونا ومئتي مليون، من الأزرق الفاتح إلى الداكن. تفصل حدود الفئات الدول الصغيرة عن الدول العملاقة رغم انحراف التوزيع."
      style-labeled:
        title: القارات مع أسماء الدول
        description: "يعرض النمط ألوان القارات مع تسمية NAME لكل دولة."
    columns:
      SOVEREIGNT: "الدولة صاحبة السيادة، وقد تختلف عن ADMIN في أقاليم مثل غرينلاند التابعة للدنمارك."
      TYPE: "نوع الوحدة: دولة ذات سيادة، أو دولة، أو تبعية، أو منطقة متنازع عليها، أو غير محددة، أو سيادة."
      ADM0_A3: "رمز Natural Earth للدولة من ثلاثة أحرف. لا يستخدم قيمة حارسة، وهو مفتاح الربط مع مجموعة الأماكن المأهولة."
      NAME: "تسمية قصيرة على الخريطة، مثل Dem. Rep. Congo."
      NAME_LONG: "الاسم الطويل، مثل Democratic Republic of the Congo. يختلف عن NAME في 21 صفا."
      POP_EST: "تقدير عدد السكان، ومعظمه يعود إلى عام 2019. راجع POP_YEAR."
      POP_YEAR: "السنة التي يشير إليها تقدير عدد السكان."
      GDP_MD: "الناتج المحلي الإجمالي بملايين الدولارات الأمريكية، ومعظمه يعود إلى عام 2019. راجع GDP_YEAR."
      GDP_YEAR: "السنة التي يشير إليها رقم الناتج المحلي الإجمالي."
      ISO_A2: "رمز ISO 3166-1 alpha-2، ويستخدم القيمة -99 للدول الخمس نفسها في ISO_A3."
      ISO_A2_EH: "رمز ISO alpha-2 بعد تصحيح فرنسا والنرويج وكوسوفو (XK)."
      ISO_A3: "رمز ISO 3166-1 alpha-3، مع القيمة الحارسة -99 لفرنسا والنرويج وكوسوفو وشمال قبرص وصوماليلاند. يفضل استخدام ISO_A3_EH."
      ISO_A3_EH: "رمز ISO alpha-3 بعد تصحيح فرنسا والنرويج. استخدمه لربط الإحصاءات الخارجية المشفرة برموز ISO."
      CONTINENT: "تصنيف القارة. يشمل القيمة Seven seas (open ocean)، ولذلك يعيد GROUP BY ثماني مجموعات."
      REGION_UN: "المنطقة الكبرى حسب الأمم المتحدة."
      SUBREGION: "المنطقة الفرعية حسب الأمم المتحدة."
      LABEL_X: "خط طول موضع التسمية المفضل."
      LABEL_Y: "خط عرض موضع التسمية المفضل."
      NE_ID: "معرف معلم ثابت من Natural Earth وفريد في هذا الملف."
      WIKIDATAID: "معرف QID في Wikidata، وموجود في جميع الصفوف البالغ عددها 177."
      geom: "هندسة الدولة، مضلع أو متعدد المضلعات، بخطي الطول والعرض وفق WGS84."
      bbox: "بنية صندوق الإحاطة لكل معلم، وهي تغطية GeoParquet المستخدمة لدفع المرشحات المكانية."
      fid: "معرف المعلم الذي عينته GDAL عند قراءة المولد لطبقة المصدر. فريد داخل هذا الملف، وليس مفتاحا من المصدر."
      SOV_A3: "رمز Natural Earth من ثلاثة أحرف للدولة صاحبة السيادة. تذكر Natural Earth أن الرمز خاص بنظام ترميزها وأنه يتبع رموز ISO alpha-3 إلى حد ما."
      GU_A3: "رمز Natural Earth من ثلاثة أحرف للوحدة الجغرافية. تذكر Natural Earth أن الرمز خاص بنظام ترميزها وأنه يتبع رموز ISO alpha-3 إلى حد ما."
      SU_A3: "رمز Natural Earth من ثلاثة أحرف للوحدة الإدارية الفرعية. تذكر Natural Earth أنه يشبه رمز ISO alpha-3 لكنه مختلف عنه."
      GEOU_DIF: "علامة تبين هل تختلف الوحدة الجغرافية عن الوحدة الإدارية الأم. تقدمها Natural Earth حتى لا تكرر الخريطة التسميات. كل الصفوف في هذا الملف تحمل القيمة 0."
      NOTE_ADM0: "ملاحظة قصيرة توضح سياق السيادة على المعلم، مثل Fr. أو U.K. القيمة فارغة في معظم الصفوف."
      NOTE_BRK: "ملاحظة توضح سياق السيادة على معلم منفصل أو متنازع عليه، مثل Self admin.; Claimed by Cyprus. القيمة فارغة في معظم الصفوف."
