    columns:
      DATAFLOW: "معرف تدفق البيانات في Eurostat، وهو القيمة الثابتة ESTAT nrg_pc_204 بالإصدار 1.0."
      LAST UPDATE: "قيمة ثابتة عند طابع زمني واحد من عام 2019 لكل صف في هذه النسخة، رغم امتداد البيانات إلى 2025. لا يعتمد عليها، فلا تستخرج منها حداثة البيانات."
      freq: "تكرار الرصد، وهو القيمة الثابتة S لنصف سنوي. تمثل S1 الفترة من يناير إلى يونيو، وتمثل S2 الفترة من يوليو إلى ديسمبر."
