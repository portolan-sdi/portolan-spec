      unit: "وحدة القياس، وهي القيمة الثابتة KWH. الأسعار لكل كيلوواط ساعة."
      tax: "مستوى الضريبة. تستبعد X_TAX جميع الضرائب والرسوم، وتستبعد X_VAT ضريبة القيمة المضافة والضرائب القابلة للاسترداد، وتشمل I_TAX كل ما تدفعه الأسرة."
      currency: "EUR أو NAC للعملة الوطنية أو PPS لمعيار القوة الشرائية. تساوي NAC اليورو في منطقة اليورو."
      geo: "الدولة المبلغة كرمز Eurostat ‏NUTS-0، وهو ISO 3166-1 alpha-2 باستثناء EL لليونان وUK للمملكة المتحدة، مع التجميعين EU27_2020 وEA. وهو مفتاح الربط مع مجموعة هندسية."
      TIME_PERIOD: "الفصل المرجعي كنص، مثل 2025-S2. التنسيق ثابت، ولذلك يعمل الترتيب النصي والدالة MAX."
      OBS_VALUE: "سعر الكهرباء المرصود بالعملة المحددة لكل كيلوواط ساعة."
      OBS_FLAG: "حالة الرصد: e تقديري، وp مؤقت، وd اختلاف في التعريف، وقيمة فارغة في 98 بالمئة من الصفوف."
      CONF_STATUS: "حالة السرية، وهي فارغة بالكامل في هذه النسخة."
