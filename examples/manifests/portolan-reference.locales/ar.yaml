catalog:
  title: كتالوج بورتولان المرجعي
  description: >-
    كتالوج مرجعي متنوع يوضح الحالات الرئيسية في مواصفة بورتولان 0.1.
    يستخدم بيانات حقيقية مفتوحة الترخيص من مصادرها الأصلية.

