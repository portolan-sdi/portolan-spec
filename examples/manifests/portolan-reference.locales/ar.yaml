collections:
  reference/natural-earth-countries:
    title: دول Natural Earth بمقياس 1:110 مليون
    description: >-
      حدود دول العالم من Natural Earth بمقياس 1:110 مليون.
      تنشر المجموعة GeoParquet مع ملف Shapefile الأصلي المضغوط.
    keywords: [حدود, دول, Natural Earth, مرجع, خريطة أساس]
    assets:
      style-continents:
        title: الدول حسب القارة
        description: "تستخدم كل قارة لونا واحدا من لوحة ألوان الكتالوج. يشمل ذلك مجموعة Seven seas (open ocean) التي يضع فيها Natural Earth الأراضي الفرنسية الجنوبية والقطبية الجنوبية."
      style-map-colors:
        title: خريطة سياسية كلاسيكية بسبعة ألوان
        description: "يستخدم النمط فهرس MAPCOLOR7 من Natural Earth. يحسب الفهرس مسبقا كي لا تشترك الدول المتجاورة في لون، كما في الخرائط السياسية الكلاسيكية."
      style-income-groups:
        title: فئات الدخل حسب البنك الدولي
        description: "يستخدم النمط ترتيب INCOME_GRP، من الأخضر الداكن لاقتصادات OECD مرتفعة الدخل إلى الأحمر للاقتصادات منخفضة الدخل. تتبع لوحة الألوان المتباعدة ذات الدرجات الخمس ترتيب الحقل."
      style-population:
        title: عدد السكان في أربع فئات
        description: "يقسم النمط POP_EST عند عشرة ملايين وخمسين مليونا ومئتي مليون، من الأزرق الفاتح إلى الداكن. تفصل حدود الفئات الدول الصغيرة عن الدول العملاقة رغم انحراف التوزيع."
      style-labeled:
        title: القارات مع أسماء الدول
        description: "يعرض النمط ألوان القارات مع تسمية NAME لكل دولة."
    columns:
      SOVEREIGNT: "الدولة صاحبة السيادة، وقد تختلف عن ADMIN في أقاليم مثل غرينلاند التابعة للدنمارك."
      TYPE: "نوع الوحدة: دولة ذات سيادة، أو دولة، أو تبعية، أو منطقة متنازع عليها، أو غير محددة، أو سيادة."
      ADM0_A3: "رمز Natural Earth للدولة من ثلاثة أحرف. لا يستخدم قيمة حارسة، وهو مفتاح الربط مع مجموعة الأماكن المأهولة."
      NAME: "تسمية قصيرة على الخريطة، مثل Dem. Rep. Congo."
      NAME_LONG: "الاسم الطويل، مثل Democratic Republic of the Congo. يختلف عن NAME في 21 صفا."
      POP_EST: "تقدير عدد السكان، ومعظمه يعود إلى عام 2019. راجع POP_YEAR."
      POP_YEAR: "السنة التي يشير إليها تقدير عدد السكان."
      GDP_MD: "الناتج المحلي الإجمالي بملايين الدولارات الأمريكية، ومعظمه يعود إلى عام 2019. راجع GDP_YEAR."
      GDP_YEAR: "السنة التي يشير إليها رقم الناتج المحلي الإجمالي."
      ISO_A2: "رمز ISO 3166-1 alpha-2، ويستخدم القيمة -99 للدول الخمس نفسها في ISO_A3."
      ISO_A2_EH: "رمز ISO alpha-2 بعد تصحيح فرنسا والنرويج وكوسوفو (XK)."
      ISO_A3: "رمز ISO 3166-1 alpha-3، مع القيمة الحارسة -99 لفرنسا والنرويج وكوسوفو وشمال قبرص وصوماليلاند. يفضل استخدام ISO_A3_EH."
      ISO_A3_EH: "رمز ISO alpha-3 بعد تصحيح فرنسا والنرويج. استخدمه لربط الإحصاءات الخارجية المشفرة برموز ISO."
      CONTINENT: "تصنيف القارة. يشمل القيمة Seven seas (open ocean)، ولذلك يعيد GROUP BY ثماني مجموعات."
      REGION_UN: "المنطقة الكبرى حسب الأمم المتحدة."
      SUBREGION: "المنطقة الفرعية حسب الأمم المتحدة."
      LABEL_X: "خط طول موضع التسمية المفضل."
      LABEL_Y: "خط عرض موضع التسمية المفضل."
      NE_ID: "معرف معلم ثابت من Natural Earth وفريد في هذا الملف."
      WIKIDATAID: "معرف QID في Wikidata، وموجود في جميع الصفوف البالغ عددها 177."
      geom: "هندسة الدولة، مضلع أو متعدد المضلعات، بخطي الطول والعرض وفق WGS84."
      bbox: "بنية صندوق الإحاطة لكل معلم، وهي تغطية GeoParquet المستخدمة لدفع المرشحات المكانية."
  reference/natural-earth-populated-places:
    title: الأماكن المأهولة في Natural Earth بمقياس 1:50 مليون
    description: >-
      نقاط للمدن والبلدات والأماكن المأهولة من Natural Earth بمقياس 1:50 مليون.
      تنشر المجموعة GeoParquet مع المصدر الأصلي.
    keywords: [أماكن, مدن, نقاط, Natural Earth, مرجع]
    assets:
      style-places:
        title: الأماكن المأهولة
        description: "يعرض النمط جميع الأماكن البالغ عددها 1251 كنقاط موحدة باللون الأحمر الدافئ."
      style-population:
        title: سكان المنطقة الحضرية، بالحجم واللون
        description: "يقسم النمط POP_MAX عند مئة ألف ومليون وعشرة ملايين. تتحكم الفئات في تدرج اللون ونصف قطر الدائرة، فتظهر طوكيو كأكبر نقطة وأشدها قتامة."
      style-feature-class:
        title: الأماكن حسب فئة المعلم
        description: "يفصل FEATURECLA بين العواصم الوطنية والإقليمية والأماكن المأهولة العادية والمحطات العلمية الأربعين في القارة القطبية الجنوبية."
      style-capitals:
        title: العواصم الوطنية مميزة
        description: "يعرض النمط الصفوف المئتين التي تحمل ADM0CAP بحجم كبير ولون أحمر فوق بقية النقاط الرمادية الهادئة."
      style-density:
        title: خريطة حرارية لكثافة الأماكن
        description: "تعرض طبقة MapLibre الحرارية مواضع تركز مجموعة النقاط المنتقاة."
    columns:
      SCALERANK: "رتبة الأهمية من 0 إلى 10، و0 هي الأهم. استخدمها لتقليل التسميات حسب مستوى التكبير."
      FEATURECLA: "نوع المكان: عاصمة من المستوى الإداري 0، أو عاصمة من المستوى 1، أو مكان مأهول، أو محطة علمية، أو إحدى أربع فئات أقل شيوعا."
      NAME: "اسم العرض مع علامات التشكيل، مثل Neuquén. ليس فريدا، إذ تتكرر أسماء مدن عدة بين الدول."
      NAMEASCII: "التهجئة الاحتياطية للاسم بأحرف ASCII."
      ADM0CAP: "تشير القيمة 1 إلى عاصمة وطنية، ويوجد 200 صف من هذا النوع في الملف."
      WORLDCITY: "تشير القيمة 1 إلى 70 مدينة بارزة عالميا."
      MEGACITY: "تشير القيمة 1 إلى 462 مكانا تعدها Natural Earth مدنا ضخمة."
      ADM0NAME: "اسم الدولة التي تقع فيها النقطة."
      ADM0_A3: "رمز الدولة في Natural Earth، وهو مفتاح الربط مع مجموعة الدول."
      ADM1NAME: "اسم المنطقة الإدارية من المستوى الأول التي تقع فيها النقطة."
      POP_MAX: "عدد سكان المنطقة الحضرية، مشتق من LandScan. تحمل طوكيو القيمة 35,676,000."
      POP_MIN: "عدد سكان المدينة داخل حدودها. تحمل طوكيو القيمة 8,336,599."
      TIMEZONE: "اسم المنطقة الزمنية حسب IANA، وهو فارغ في 114 صفا."
      MIN_ZOOM: "أدنى مستوى تكبير مقترح لإظهار المكان على خريطة ويب."
      WIKIDATAID: "معرف QID في Wikidata، وهو مفقود في 7 صفوف."
      NE_ID: "معرف معلم ثابت من Natural Earth وفريد في هذا الملف."
      GEONAMESID: "معرف GeoNames، وهو مفقود في 43 صفا."
      geom: "هندسة نقطية بخطي الطول والعرض وفق WGS84. استخدمها بدلا من عمودي LATITUDE وLONGITUDE القديمين."
      bbox: "بنية صندوق الإحاطة لكل معلم، وهي تغطية GeoParquet."
  boundaries/us-counties:
    title: مقاطعات الولايات المتحدة لعام 2023 بمقياس 1:500 ألف
    description: >-
      حدود المقاطعات وما يعادلها من ملف التعداد الأمريكي لعام 2023.
      تنشر المجموعة الحدود المبسطة بصيغة GeoParquet مع المصدر الأصلي.
    keywords: [حدود, مقاطعات, الولايات المتحدة, تعداد, TIGER]
    assets:
      style-states:
        title: المقاطعات حسب الولاية
        description: "يلون النمط كل مقاطعة حسب STATE_NAME من لوحة ألوان الكتالوج. تنتج الفسيفساء الكلاسيكية حدود الولايات من تعبئة المقاطعات."
      style-labeled:
        title: ألوان الولايات مع أسماء المقاطعات
        description: "يعرض النمط فسيفساء الولايات مع تسمية NAME لكل مقاطعة."
      style-land-area:
        title: مساحة اليابسة في أربع فئات
        description: "يقسم النمط ALAND عند مليار ومليارين ونصف وعشرة مليارات متر مربع، من الأزرق الفاتح إلى الداكن. تقع مناطق التعداد في ألاسكا عند الطرف الداكن."
      style-water-share:
        title: نسبة المياه
        description: "يقسم النمط AWATER على المساحة الكلية، ثم يحدد الفئات داخل تعبير النمط. يمتد اللون من شبه الأبيض للمقاطعات الجافة إلى الأزرق الداكن حيث تسود المياه الإقليمية."
      style-county-types:
        title: أنواع ما يعادل المقاطعة
        description: "يفصل رمز LSAD المقاطعات عن أبرشيات لويزيانا وأحياء ألاسكا ومناطق التعداد وبلديات بورتوريكو والمدن المستقلة ومناطق التخطيط في كونيتيكت."
    columns:
      STATEFP: "رمز FIPS للولاية أو الإقليم من رقمين، محفوظ كنص مع صفر بادئ."
      COUNTYFP: "رمز FIPS للمقاطعة من ثلاثة أرقام، وهو فريد داخل الولاية."
      COUNTYNS: "رمز ANSI ‏(GNIS) من ثمانية أرقام، وهو المعرف الدائم الذي يبقى بعد إعادة تعيين FIPS."
      GEOIDFQ: "معرف GEOID كامل التأهيل، ويتكون من 0500000US متبوعا بـ GEOID. يطابق مباشرة عمود GEO_ID في تنزيلات data.census.gov، وكان يسمى AFFGEOID قبل إصدار 2023."
      GEOID: "مفتاح الربط القياسي لإحصاءات المقاطعات الأمريكية، وهو دمج STATEFP وCOUNTYFP في خمسة أرقام. احتفظ به كنص لأن التحويل إلى عدد صحيح يحذف الصفر البادئ."
      NAME: "الاسم الأساسي فقط، مثل Denver. تحمل 31 صفا اسم Washington، لذلك لا تستخدمه مفتاحا."
      NAMELSAD: "الاسم مع وصفه القانوني أو الإحصائي، مثل St. Louis city. وهو اسم العرض."
      STUSPS: "اختصار USPS للولاية أو الإقليم من حرفين."
      STATE_NAME: "الاسم الكامل للولاية أو الإقليم."
      LSAD: "رمز وصف المنطقة القانوني أو الإحصائي. يظهر في هذا الملف اثنا عشر نوعا من الوحدات المكافئة للمقاطعة."
      ALAND: "مساحة اليابسة بالمتر المربع، محسوبة من الحدود القانونية كاملة الدقة لا من هذه الهندسة المعممة."
      AWATER: "مساحة المياه بالمتر المربع، وتشمل المياه الإقليمية الواقعة خارج هندسة الساحل المقصوصة."
      geom: "هندسة المقاطعة مقصوصة عند الساحل، بخطي الطول والعرض وفق NAD83."
      bbox: "بنية صندوق الإحاطة لكل معلم، وهي تغطية GeoParquet."
  boundaries/boston-open-space:
    title: المساحات المفتوحة في بوسطن
    description: >-
      حدائق وملاعب وحقول ومناطق محمية ومقابر من نظام بوسطن الجغرافي.
      تحتوي المجموعة على 1012 مضلعا بصيغ GeoParquet وPMTiles.
    keywords: [مساحات مفتوحة, حدائق, بوسطن, ترفيه, حدود]
    assets:
      style-types:
        title: المساحات المفتوحة حسب النوع
        description: "يفصل TypeLong بين الحدائق وطرق الحدائق والمحميات والمقابر والمناطق البرية الحضرية والساحات والحدائق المجتمعية."
      style-labeled:
        title: الأنواع مع أسماء المواقع
        description: "يعرض النمط ألوان الأنواع مع تسمية SITE_NAME لكل موقع."
      style-acreage:
        title: المساحة في أربع فئات
        description: "يقسم النمط ACRES عند فدان واحد وعشرة أفدنة ومئة فدان، من الأخضر الفاتح إلى الداكن. يمتد النطاق من الحدائق الصغيرة إلى 392 فدانا في Franklin Park."
      style-ownership:
        title: جهة الملكية
        description: "يعرض النمط OWNERSHIP من لوحة ألوان الكتالوج. تظهر مواقع المدينة والكومنولث والحكومة الاتحادية والمواقع الخاصة البالغ عددها 214 جنبا إلى جنب."
      style-protection:
        title: محمية بشكل دائم أو غير محمية
        description: "يعرض النمط علامة POS بالأخضر الداكن للحماية الدائمة بموجب المادة 97 أو قيد حفظ، وبالرمادي لغير المحمي. تعيد المطابقة الداخلية تسمية الرمزين X وN كي يعرض مفتاح الخريطة كلمات واضحة."
    columns:
      SITE_NAME: "الاسم الرسمي أو الأشهر للموقع. تحمل المواقع متعددة القطع لواحق بأرقام رومانية، مثل Stony Brook Reservation I وII."
      OWNERSHIP: "مالك العقار حيث يكون معروفا: مدينة بوسطن، أو كومنولث ماساتشوستس، أو مالكون خاصون، أو اختصارات جهات مثل BRA وBNAN."
      PROTECTION: "أدوات الحماية القانونية مفصولة بشرطات مائلة. يمثل A97 المادة 97 من دستور ماساتشوستس، وهي الأقوى. هذا نص حر، فطابقه باستخدام LIKE."
      TYPECODE: "نوع رقمي للمساحة المفتوحة من 1 إلى 7. يختلف عن TypeLong في نحو 13 صفا، فاعتبر TypeLong أقرب إلى المعنى المقصود."
      DISTRICT: "منطقة التخطيط حسب خطة المساحات المفتوحة للمدينة، وليست حدود الأحياء الرسمية. تشمل القيمة غير المكانية Multi-District."
      ACRES: "المساحة الرسمية بالأفدنة لجزء المساحة المفتوحة. استخدمها بدلا من حساب مساحة الهندسة."
      ADDRESS: "عنوان الشارع إن كان معروفا، وهو فارغ في 589 صفا."
      ZonAgg: "منطقة تقسيم استعمالات مجمعة، مثل Open Space District."
      TypeLong: "نوع المساحة المفتوحة كنص، مع اختلافات إملائية طفيفة يستحسن توحيدها قبل التجميع."
      OS_Own_Jur: "الجهة التي تملك حقوق المساحة المفتوحة: BPRD أو DCR أو لجنة بوسطن للحفظ أو None."
      OS_Mngmnt: "الجهة المديرة فقط عندما تختلف عن OS_Own_Jur. تعني القيمة الفارغة أن الجهة الحارسة تدير الموقع، لا أن البيانات مفقودة."
      POS: "علامة المساحة المفتوحة المحمية. تعني X حماية دائمة، وتعني N أنها غير محمية."
      PA: "علامة وصول الجمهور. تعني X متاحة، وA بموعد، وN عدم الوصول أو عدم معرفته."
      ALT_NAME: "أسماء بديلة رسمية أو سابقة أو دارجة."
      AgncyJuris: "جهة الاختصاص للمواقع الحكومية غير المحمية. العمود قليل القيم عمدا."
      ShapeSTAre: "المساحة التي حسبها ArcGIS بالمتر المربع من هندسة State Plane المصدرية."
      ShapeSTLen: "المحيط الذي حسبه ArcGIS بالأمتار."
      geom: "هندسة الموقع بخطي الطول والعرض وفق WGS84."
      bbox: "بنية صندوق الإحاطة لكل معلم، وهي تغطية GeoParquet."
  boundaries/netherlands-provinces:
    title: مقاطعات هولندا
    description: >-
      حدود المقاطعات الهولندية الاثنتي عشرة من خدمة PDOK التابعة للسجل العقاري.
      تنشر المجموعة GeoParquet وPMTiles مع أنماط خرائط.
    keywords: [حدود, مقاطعات, هولندا, إداري, PDOK]
    assets:
      style-provinces:
        title: المقاطعات حسب الاسم
        description: "يعرض النمط المقاطعات الاثنتي عشرة بلون واحد من لوحة الألوان لكل مقاطعة."
      style-labeled:
        title: المقاطعات مع الأسماء
        description: "يعرض النمط ألوان المقاطعات مع تسمية naam لكل مقاطعة."
      style-randstad:
