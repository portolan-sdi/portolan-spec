  tabular/eurostat-electricity-prices:
    title: أسعار كهرباء الأسر من Eurostat
    description: >-
      أسعار كهرباء نصف سنوية للأسر حسب البلد وفئة الاستهلاك والضريبة والعملة.
      تنشر المجموعة جدول nrg_pc_204 بصيغة Parquet للربط مع خريطة NUTS 0.
