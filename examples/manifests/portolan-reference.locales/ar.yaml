      MAPCOLOR7: "فهرس لون الخريطة. تذكر Natural Earth أن لون الخريطة مشتق من خريطة سياسية للعالم أعدتها وزارة الخارجية الأمريكية، وفيها لا تحمل الدول المتجاورة اللون نفسه، وتشترك كل أقاليم الدولة صاحبة السيادة في لون واحد."
