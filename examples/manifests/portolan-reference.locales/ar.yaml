      ZonAgg: "منطقة تقسيم استعمالات مجمعة، مثل Open Space District."
      TypeLong: "نوع المساحة المفتوحة كنص، مع اختلافات إملائية طفيفة يستحسن توحيدها قبل التجميع."
      OS_Own_Jur: "الجهة التي تملك حقوق المساحة المفتوحة: BPRD أو DCR أو لجنة بوسطن للحفظ أو None."
      OS_Mngmnt: "الجهة المديرة فقط عندما تختلف عن OS_Own_Jur. تعني القيمة الفارغة أن الجهة الحارسة تدير الموقع، لا أن البيانات مفقودة."
      POS: "علامة المساحة المفتوحة المحمية. تعني X حماية دائمة، وتعني N أنها غير محمية."
      PA: "علامة وصول الجمهور. تعني X متاحة، وA بموعد، وN عدم الوصول أو عدم معرفته."
      ALT_NAME: "أسماء بديلة رسمية أو سابقة أو دارجة."
      AgncyJuris: "جهة الاختصاص للمواقع الحكومية غير المحمية. العمود قليل القيم عمدا."
      ShapeSTAre: "المساحة التي حسبها ArcGIS بالمتر المربع من هندسة State Plane المصدرية."
      ShapeSTLen: "المحيط الذي حسبه ArcGIS بالأمتار."
      geom: "هندسة الموقع بخطي الطول والعرض وفق WGS84."
      bbox: "بنية صندوق الإحاطة لكل معلم، وهي تغطية GeoParquet."
      fid: "معرف المعلم الذي عينته GDAL عند قراءة المولد لطبقة المصدر. فريد داخل هذا الملف، وليس مفتاحا من المصدر."
      OBJECTID: "معرف الكائن في Esri الذي يعينه ArcGIS لكل صف في طبقة المصدر. فريد داخل هذا الملف."
